overrides:
  check-counter:
    dry_run: true
  ceph:
    log-ignorelist:
      - evicting unresponsive client
      - RECENT_CRASH
  # DEBUG(teuth 634231): kernel client dynamic debug ("module ceph +p"),
  # enabled on first mount, disabled on last umount; ends up in kern.log
  kclient:
    dynamic_debug: true

tasks:
- exec:
    mon.a:
      - ceph config set mgr mgr/crash/warn_recent_interval 0
- cephfs_test_runner:
    fail_on_skip: false
    modules:
      # DEBUG(teuth 634231): run only the failing test
      - tasks.cephfs.test_snapshots.TestSnapshots.test_multimds_hardlink
