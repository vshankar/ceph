overrides:
  check-counter:
    dry_run: true
  ceph:
    log-ignorelist:
      - evicting unresponsive client
      - RECENT_CRASH

tasks:
- exec:
    mon.a:
      - ceph config set mgr mgr/crash/warn_recent_interval 0
# DEBUG(teuth 634231): kernel client dynamic debug for the capsnap/writeback/
# truncate paths; ends up in kern.log. Not kclient's dynamic_debug option: that
# one is refcounted on mounts and gets switched off for good when
# CephFSTestCase.setUp() unmounts everything. Settings made here stick for as
# long as the module stays loaded.
- exec:
    client.0:
      - modprobe ceph
      - echo 'file fs/ceph/snap.c +p' > /sys/kernel/debug/dynamic_debug/control
      - echo 'file fs/ceph/caps.c +p' > /sys/kernel/debug/dynamic_debug/control
      - echo 'file fs/ceph/addr.c +p' > /sys/kernel/debug/dynamic_debug/control
      - echo 'file fs/ceph/inode.c +p' > /sys/kernel/debug/dynamic_debug/control
      - echo 'file fs/ceph/file.c +p' > /sys/kernel/debug/dynamic_debug/control
- cephfs_test_runner:
    fail_on_skip: false
    modules:
      # DEBUG(teuth 634231): run only the failing test
      - tasks.cephfs.test_snapshots.TestSnapshots.test_multimds_hardlink
