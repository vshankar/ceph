overrides:
  ceph:
    conf:
      osd:
        osd shutdown pgref assert: true
tasks:
- cephadm:
    roleless: false
- cephadm.shell:
    mon.a:
      - ceph orch status
      - ceph orch ps
      - ceph orch ls
      - ceph orch host ls
      - ceph orch device ls
- cephadm.shell:
    mon.a:
      - cmd: ceph nfs cluster create nfs-ganesha-test
      - cmd: ceph nfs export apply -i /dev/stdin
        stdin: |
          EXPORT {
             "access_type": "RW",
             "clients": [],
             "cluster_id": "nfs-ganesha-test",
             "export_id": 1,
             "fsal": {
               "cmount_path": "/",
               "fs_name": "cephfs",
               "name": "CEPH",
               "user_id": "nfs.nfs-ganesha-test.cephfs.a4cd9f65"
             },
             "path": "/",
             "protocols": [
               3,
               4
             ],
             "pseudo": "/nfsganesha",
             "security_label": true,
             "squash": "none",
             "transports": [
               "TCP"
             ]
         }
         CEPH {
             async = false;
             zerocopy = false;
         }
      # for debug
      - cmd: ceph nfs export info nfs-ganesha-test --pseudo_path=/nfsganesha
      # for debug
      - cmd: ceph orch ls --service-name nfs.nfs-ganesha-test --export
